[package]
name = "pelican"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wayhouse plugin that routes hostnames to the Pelican panel's game servers: one entry node, no per-host DNS or firewall edits."
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wayhouse-plugin-abi = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
