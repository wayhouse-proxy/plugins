[package]
name = "acme-dns-cloudflare"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "wayhouse plugin that answers ACME DNS-01 challenges by setting and removing TXT records in Cloudflare DNS."
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
wayhouse-plugin-abi = { workspace = true }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
