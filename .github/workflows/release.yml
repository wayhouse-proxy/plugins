name: Release

# Publishes plugins whose `<name>-v<version>` release does not exist yet, then refreshes
# index.json on main. Run it from the Actions tab on main (input: one plugin, or "all").
# Published versions are immutable: an existing release is never touched, and the index
# generator refuses a changed sha256 for a version it already lists. To ship a change,
# bump the version in the plugin's Cargo.toml, merge, run this. `selftest` is never published.
#
# Signing: set the repository secrets MINISIGN_SECRET_KEY (the secret key file's contents)
# and MINISIGN_PASSWORD. This is the same key the sniffers repository signs with. Without
# them the job fails; pass `unsigned: true` for a dry run (the job summary says so).
# The signature's trusted comment is `wayhouse-v1 plugin <name> <version> <abi> <sha256>`
# (`scripts/registry.py claim`); wayhouse refuses a signature without it.

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin name, or "all" for every plugin without a release'
        required: true
        default: all
      unsigned:
        description: 'Publish without a signature (dry runs only; a version published unsigned can never be signed later)'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  release:
    name: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create releases and push the index.json branch
      pull-requests: write   # open the index.json pull request and queue it
      actions: write   # dispatch CI on that branch (the workflow token does not trigger it)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Require the signing key
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          ALLOW_UNSIGNED: ${{ inputs.unsigned }}
        run: |
          # Releases are immutable: a version published unsigned can never be signed later.
          if [ -z "$MINISIGN_SECRET_KEY" ] && [ "$ALLOW_UNSIGNED" != true ]; then
            echo "::error::MINISIGN_SECRET_KEY is empty; refusing to publish unsigned (re-run with unsigned=true for a dry run)"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: ./.github/actions/registry-gen
      - name: Pick the plugins
        id: pick
        env:
          INPUT: ${{ inputs.plugin }}
        run: |
          set -euo pipefail
          if [ "$INPUT" = all ]; then
            names=$(ls plugins | grep -vx selftest)
          else
            [[ "$INPUT" =~ ^[A-Za-z0-9_-]+$ ]] && [ "$INPUT" != selftest ] && [ -d "plugins/$INPUT" ] || { echo "no such publishable plugin: $INPUT" >&2; exit 1; }
            names=$INPUT
          fi
          echo "names=$(echo $names)" >> "$GITHUB_OUTPUT"
      - name: Build and stage
        run: |
          set -euo pipefail
          python3 scripts/registry_test.py
          cargo build --locked --release --target wasm32-unknown-unknown --workspace
          python3 scripts/registry.py stage --out dist-new ${{ steps.pick.outputs.names }}
      - name: Check the index this release would produce, before any release exists
        run: |
          set -euo pipefail
          cp index.json "$RUNNER_TEMP/index.json"
          python3 scripts/registry.py generate --name "wayhouse official plugins" \
            --base-url "https://github.com/${{ github.repository }}/releases/download" \
            --out "$RUNNER_TEMP/index.json" dist-new/*
          python3 scripts/registry.py verify "$RUNNER_TEMP/index.json"
          wayhouse-registry-gen verify-plugin "$RUNNER_TEMP/index.json"
      - name: Install minisign (only when a signing key is configured)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            sudo apt-get update && sudo apt-get install -y minisign
          fi
      - name: Create releases
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          key=
          if [ -n "$MINISIGN_SECRET_KEY" ]; then
            key=$(mktemp); chmod 600 "$key"
            printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
            trap 'rm -f "$key"' EXIT
          fi
          for name in ${{ steps.pick.outputs.names }}; do
            version=$(python3 -c 'import sys,tomllib; print(tomllib.load(open(sys.argv[1],"rb"))["package"]["version"])' "plugins/$name/Cargo.toml")
            tag="$name-v$version"
            mkdir -p "dist/$name"
            if gh release view "$tag" >/dev/null 2>&1; then
              # Already published: take the published bytes, never a rebuild.
              echo "::notice::$tag exists, keeping the published module"
              gh release download "$tag" --dir "dist/$name" --pattern "$name.wasm*" --clobber
              continue
            fi
            cp "dist-new/$name/"* "dist/$name/"
            assets=("dist/$name/$name.wasm")
            if [ -n "$key" ]; then
              # The trusted comment names the artifact (name, version, ABI, sha256), so a
              # signature cannot be replayed under another name or version (#594).
              claim=$(python3 scripts/registry.py claim "$name" "$version" "dist/$name/$name.wasm")
              printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -t "$claim" -m "dist/$name/$name.wasm" -x "dist/$name/$name.wasm.minisig"
              assets+=("dist/$name/$name.wasm.minisig")
              echo "- $tag: signed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $tag: **unsigned** (no MINISIGN_SECRET_KEY secret)" >> "$GITHUB_STEP_SUMMARY"
            fi
            gh release create "$tag" "${assets[@]}" --target "$GITHUB_SHA" --title "$name $version" \
              --notes "Plugin \`$name\` $version. sha256 \`$(sha256sum "dist/$name/$name.wasm" | cut -d' ' -f1)\`."
          done
      - name: Refresh index.json
        run: |
          set -euo pipefail
          python3 scripts/registry.py generate --name "wayhouse official plugins" \
            --base-url "https://github.com/${{ github.repository }}/releases/download" \
            --out index.json dist/*
          python3 scripts/registry.py verify index.json
          wayhouse-registry-gen verify-plugin index.json
      - name: Open a pull request for index.json and queue it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- index.json && [ -n "$(git ls-files index.json)" ]; then
            echo "index.json unchanged"; exit 0
          fi
          # main only takes pull requests through the merge queue, so the update goes in as one.
          branch="release-index/run-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add index.json
          git commit -m "chore: update index.json"
          git push origin "$branch"
          hint="index.json is attached to this run as an artifact: open the pull request by hand. Automatic PRs need Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests'."
          gh pr create --base main --head "$branch" --title "chore: update index.json" \
            --body "Index refresh from release run ${{ github.run_id }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}." \
            || { echo "::error::could not open the index.json pull request. $hint"; exit 1; }
          # A pull request opened with the workflow token does not start CI, so ci-ok would never
          # report. Dispatch CI on the branch instead: its ci-ok check run attaches to the head commit.
          gh workflow run ci.yml --ref "$branch" \
            || { echo "::error::could not start CI on $branch; the pull request is open but will not merge by itself."; exit 1; }
          gh pr merge "$branch" --auto --squash \
            || { echo "::error::could not queue the pull request; queue it by hand."; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: index
          path: index.json
          if-no-files-found: ignore
