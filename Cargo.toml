[workspace]
resolver = "2"
# One crate per plugin under plugins/<name>/. Every plugin builds for wasm32-unknown-unknown.
members = ["plugins/*"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wayhouse-proxy/plugins"

[workspace.dependencies]
# The plugin ABI lives in the wayhouse repository (cargo finds the crate by name). Pinned
# to an exact commit; CI builds wayhouse-plugin-check from the same revision, so this
# revision is the single place to bump when the ABI changes (ABI 0.2 as of this commit: manifest options and capability bindings).
wayhouse-plugin-abi = { git = "https://github.com/wayhouse-proxy/wayhouse", rev = "10201de6bdf0ae7a8ada5a1ca9e7a416fbc9766f" }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
